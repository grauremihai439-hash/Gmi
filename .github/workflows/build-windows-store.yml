name: Build Microsoft Store package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  appx:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Require production API URL
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ vars.API_BASE_URL }}")) {
            throw "Set the API_BASE_URL repository variable to the public HTTPS API URL before packaging."
          }

      - name: Build x64 APPX
        run: npm run package:windows
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: ai-chatbot-ask-ai-gpt-store-x64
          path: apps/desktop/release/*.appx
          if-no-files-found: error
          retention-days: 30
